# JCEF CI pipeline (Thrameos/java-cef fork).
#
# Test/Coverage (full build + headless JUnit run) are Linux-only -- see
# plan/findings.md for the staging rationale (zero verified-working recipe for
# headless Windows/macOS CEF test execution yet; proving the pattern on one platform
# first beats a slow first push).
#
# BuildWindows/BuildMacOS below are a lower-risk fast-follow: build-only (native
# compile + Java compile, no test execution), since none of the hangs/crashes found
# on Linux this session (java-cef#3, #4) are build-time issues -- they're all in
# test-time browser lifecycle/shutdown. Unverified: written against jpype's known-
# working image/task patterns and this repo's own tools/compile.bat, but there is no
# Windows/macOS machine in this dev environment to actually run them on before this
# pipeline's first real execution.

trigger:
  branches:
    include:
    - master
    - fix/*
    - ci/*
  paths:
    include:
    - .azure/*
    - CMakeLists.txt
    - cmake/*
    - native/*
    - java/*
    - tools/*

pr:
  branches:
    include:
    - master

jobs:
- job: Test
  pool:
    vmImage: "ubuntu-latest"
  timeoutInMinutes: 20
  steps:
  - template: scripts/jdk.yml
  - template: scripts/cache-cef.yml
  - template: scripts/build.yml
    parameters:
      enableCoverage: false
  - template: scripts/test.yml

- job: Coverage
  pool:
    vmImage: "ubuntu-latest"
  timeoutInMinutes: 20
  steps:
  - template: scripts/jdk.yml
  - template: scripts/cache-cef.yml
  - template: scripts/coverage.yml

- job: BuildWindows
  pool:
    vmImage: "windows-2022"
  timeoutInMinutes: 20
  steps:
  - template: scripts/jdk.yml
  - template: scripts/cache-cef.yml
  - script: python -m pip install six
    displayName: 'Install six (vendored gsutil under tools/buildtools needs six.moves; not preinstalled on this image)'
  - script: |
      mkdir jcef_build
      cd jcef_build
      cmake -G "Visual Studio 17 2022" -A x64 -DCMAKE_BUILD_TYPE=Release ..
      cmake --build . --config Release --target jcef
    displayName: 'Configure and build native (jcef)'
  - script: tools\compile.bat win64
    displayName: 'Compile Java'

- job: BuildMacOS
  pool:
    vmImage: "macos-14"
  timeoutInMinutes: 20
  steps:
  - template: scripts/jdk.yml
  - template: scripts/cache-cef.yml
  - bash: python3 -m pip install --break-system-packages six
    displayName: 'Install six (vendored gsutil under tools/buildtools needs six.moves; not preinstalled on this image)'
  - bash: |
      mkdir jcef_build
      cd jcef_build
      cmake -G "Ninja" -DCMAKE_BUILD_TYPE=Release ..
      ninja jcef
    displayName: 'Configure and build native (jcef, invokes Ant for Java per CLAUDE.md)'
