# JCEF CI pipeline (Thrameos/java-cef fork).
#
# Linux-only for now -- see plan/findings.md for the staging rationale (this repo has
# zero verified-working recipe for headless Windows/macOS CEF test execution yet;
# proving the pattern on one platform first beats a slow first push). Windows/macOS
# matrix expansion is an explicit fast-follow, not part of this pipeline.

trigger:
  branches:
    include:
    - master
    - fix/*
    - ci/*
  paths:
    include:
    - .azure/*
    - CMakeLists.txt
    - cmake/*
    - native/*
    - java/*
    - tools/*

pr:
  branches:
    include:
    - master

jobs:
- job: Test
  pool:
    vmImage: "ubuntu-latest"
  timeoutInMinutes: 20
  steps:
  - template: scripts/cache-cef.yml
  - template: scripts/build.yml
    parameters:
      enableCoverage: false
  - template: scripts/test.yml

- job: Coverage
  pool:
    vmImage: "ubuntu-latest"
  timeoutInMinutes: 20
  steps:
  - template: scripts/cache-cef.yml
  - template: scripts/coverage.yml
