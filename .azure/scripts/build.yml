# Configure and build the native jcef/jcef_helper targets, then compile the Java
# side. Assumes third_party/cef is already populated (see cache-cef.yml) and JDK/
# build tools are already on PATH (see jdk.yml, deps.yml).

parameters:
- name: enableCoverage
  type: boolean
  default: false

steps:
- bash: |
    sudo apt-get update
    sudo apt-get install -y ninja-build libx11-dev libgtk-3-dev libnss3 libasound2t64
  displayName: 'Install native build dependencies'

- bash: |
    mkdir -p jcef_build
    cd jcef_build
    cmake -G "Ninja" -DCMAKE_BUILD_TYPE=Release \
      -DENABLE_COVERAGE=${{ lower(parameters.enableCoverage) }} \
      ..
    ninja jcef
  displayName: 'Configure and build native (jcef)'

- bash: |
    tools/compile.sh linux64
  displayName: 'Compile Java'
