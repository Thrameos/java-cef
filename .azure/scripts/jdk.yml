# Pin an explicit, stable JDK version rather than relying on whatever a hosted
# image happens to default to -- avoids version-skew surprises like a too-new JDK
# producing bytecode a pinned tool version (e.g. JaCoCo) doesn't support yet.

parameters:
- name: version
  type: string
  default: '21'

steps:
- task: JavaToolInstaller@0
  inputs:
    versionSpec: ${{ parameters.version }}
    jdkArchitectureOption: 'x64'
    jdkSourceOption: 'PreInstalled'

# CI-only guard, cheap insurance: a "headless" JDK package (e.g. Debian/Ubuntu's
# openjdk-*-jdk-headless, as opposed to the full openjdk-*-jdk) omits libjawt.so
# (the AWT native bridge) entirely. JCEF always creates Swing/AWT components --
# even OSR browsers -- so libjcef.so's transitive dependency on libjawt.so fails
# to resolve and every CEF native call in the test bench fails with a confusing
# UnsatisfiedLinkError deep in test output, not an obvious "wrong JDK" message.
# Verified locally: openjdk-21-jdk-headless reproduces this exactly (see
# plan/findings.md). JavaToolInstaller's hosted-image PreInstalled JDKs are
# expected to be full JDKs, but headless-only JDKs are common enough in CI images
# generally that this is worth failing fast on here instead of downstream.
- bash: |
    JAWT_PATH="$(find "$JAVA_HOME" -name 'libjawt.so' -print -quit)"
    if [ -z "$JAWT_PATH" ]; then
      echo "##vso[task.logissue type=error]libjawt.so not found under JAVA_HOME=$JAVA_HOME -- this JDK looks headless-only (e.g. a *-jdk-headless package), which breaks every JCEF native call. Use a full JDK instead."
      exit 1
    fi
    echo "Found libjawt.so at $JAWT_PATH"
  displayName: 'Verify JDK includes AWT native support (libjawt.so)'
