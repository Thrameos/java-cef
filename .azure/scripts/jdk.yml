# Pin an explicit, stable JDK version rather than relying on whatever a hosted
# image happens to default to -- avoids version-skew surprises like a too-new JDK
# producing bytecode a pinned tool version (e.g. JaCoCo) doesn't support yet.

parameters:
- name: version
  type: string
  default: '21'

steps:
- task: JavaToolInstaller@0
  inputs:
    versionSpec: ${{ parameters.version }}
    jdkArchitectureOption: 'x64'
    jdkSourceOption: 'PreInstalled'
