# Native coverage via gcov/gcovr (instruments native/*.cpp only, not the vendored
# libcef_dll_wrapper -- see ENABLE_COVERAGE in CMakeLists.txt / native/CMakeLists.txt)
# and Java coverage via a JaCoCo agent around the same JUnit run used by test.yml.
# Both reports uploaded to Codecov in one step. Mirrors jpype's
# .azure/scripts/coverage.yml pattern (gcovr + JaCoCo + one Codecov upload), adapted
# for JCEF's build layout.

steps:
- bash: |
    sudo apt-get update
    sudo apt-get install -y ninja-build libx11-dev libgtk-3-dev libnss3 libasound2t64 \
      gcovr xvfb icewm dbus-x11
  displayName: 'Install build + coverage + headless test dependencies'

- bash: |
    mkdir -p jcef_build
    cd jcef_build
    cmake -G "Ninja" -DENABLE_COVERAGE=ON ..
    ninja jcef
  displayName: 'Configure and build native (coverage-instrumented)'

- bash: |
    tools/compile.sh linux64
  displayName: 'Compile Java'

- bash: |
    curl -sSL -o jacocoagent.jar \
      https://repo1.maven.org/maven2/org/jacoco/org.jacoco.agent/0.8.12/org.jacoco.agent-0.8.12-runtime.jar
    curl -sSL -o jacococli.jar \
      https://repo1.maven.org/maven2/org/jacoco/org.jacoco.cli/0.8.12/org.jacoco.cli-0.8.12-nodeps.jar
  displayName: 'Fetch JaCoCo'

- bash: |
    Xvfb :99 -screen 0 1280x1024x24 -nolisten tcp -nolisten unix &
    sleep 2
    DISPLAY=:99 icewm &
    sleep 2
  displayName: 'Start Xvfb + window manager'

- bash: |
    export DISPLAY=:99
    eval $(dbus-launch --sh-syntax)

    # ENABLE_COVERAGE forces a Debug build (see CMakeLists.txt), not Release.
    LIB_PATH="$(pwd)/jcef_build/native/Debug"
    OUT_PATH="$(pwd)/out/linux64"
    export LD_LIBRARY_PATH="$LIB_PATH"

    CLS_PATH="$OUT_PATH"
    for jar in third_party/jogamp/jar/*.jar; do
      CLS_PATH="$(pwd)/${jar}:${CLS_PATH}"
    done

    LD_PRELOAD=libcef.so timeout 120 java \
      -Djava.library.path="$LIB_PATH" \
      -javaagent:jacocoagent.jar=destfile=jacoco.exec \
      -jar third_party/junit/junit-platform-console-standalone-*.jar \
      -cp "$CLS_PATH" --select-package tests.junittests --config debugPrint=true
  displayName: 'Run JUnit test bench under JaCoCo agent'
  # KNOWN ISSUE (see plan/findings.md / tracked in a fork issue): CEF's native
  # shutdown reliably crashes (DCHECK failed: all_.empty() in browser_context.cc)
  # in Debug builds, which coverage instrumentation requires. Individual test
  # results are unaffected (the crash is in final process teardown, after all
  # tests already completed), but this currently means zero .gcda data is
  # produced (the process is killed before gcov's atexit flush runs), and this
  # step's own exit code is non-zero. continueOnError so this doesn't hard-block
  # the pipeline while the underlying native issue is unresolved.
  continueOnError: true

- bash: |
    gcovr -r . --xml -o coverage_native.xml \
      --filter 'native/' --exclude-unreachable-branches --exclude-throw-branches \
      --gcov-ignore-parse-errors=negative_hits.warn
    java -jar jacococli.jar report jacoco.exec \
      --classfiles out/linux64 --sourcefiles java \
      --xml coverage_java.xml
    bash <(curl -s https://codecov.io/bash) -f coverage_native.xml -f coverage_java.xml -X gcov
  displayName: 'Generate and upload coverage reports'

- task: PublishCodeCoverageResults@2
  inputs:
    codeCoverageTool: 'JaCoCo'
    summaryFileLocation: coverage_java.xml
    pathToSources: java

- task: PublishCodeCoverageResults@2
  inputs:
    codeCoverageTool: 'cobertura'
    summaryFileLocation: coverage_native.xml
