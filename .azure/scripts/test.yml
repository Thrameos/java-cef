# Run the JUnit test bench headlessly. Requires its own X server, window manager,
# and D-Bus session -- a bare Xvfb has neither a WM nor a real dbus session, and
# CEF's windowed-mode X11 path (even for the OSR tests, which still open an AWT
# window to host the off-screen buffer) needs both; without a WM, CEF stalls before
# even creating a browser (see plan/findings.md for the full investigation). Verified
# locally: 12/12 tests pass under this exact Xvfb+icewm+dbus-launch combination.
#
# The `timeout` wrapper is deliberate: a future regression in the windowed-close
# handshake area (or a new test that accidentally uses TestFrame's default windowed
# mode -- see java-cef#364) should fail the build loudly and fast, not hang the whole
# pipeline for its full time budget.

steps:
- bash: |
    sudo apt-get update
    sudo apt-get install -y xvfb icewm dbus-x11
  displayName: 'Install headless test dependencies'

- bash: |
    Xvfb :99 -screen 0 1280x1024x24 -nolisten tcp -nolisten unix &
    sleep 2
    DISPLAY=:99 icewm &
    sleep 2
  displayName: 'Start Xvfb + window manager'

- bash: |
    export DISPLAY=:99
    eval $(dbus-launch --sh-syntax)
    timeout 120 tools/run_tests.sh linux64 Release --config debugPrint=true
  displayName: 'Run JUnit test bench'
